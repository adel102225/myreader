<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaPin - Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; color: #fff; font-family: sans-serif; }
    .top-bar { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      background: rgba(15, 15, 15, 0.95); 
      padding: 12px 16px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      z-index: 100; 
      border-bottom: 1px solid #222;
    }
    .back-btn { color: #a855f7; text-decoration: none; font-weight: bold; font-size: 14px; }
    .pages-container { display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
    .pages-container img { width: 100%; max-width: 800px; height: auto; display: block; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="#" onclick="history.back(); return false;" class="back-btn">← Back</a>
    <span id="pageCount" style="font-size: 12px; color: #aaa;">Loading pages...</span>
  </div>

  <div id="pagesContainer" class="pages-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const chapterId = urlParams.get('chapterId');

    async function loadPages() {
      if (!chapterId) {
        document.getElementById('pagesContainer').innerHTML = '<p style="margin-top:80px; color:#888;">No chapter specified.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/pages/${chapterId}`);
        const pages = await res.json();

        const container = document.getElementById('pagesContainer');
        const pageCount = document.getElementById('pageCount');

        if (!pages || pages.length === 0) {
          container.innerHTML = '<p style="margin-top:80px; color:#888;">No pages found for this chapter.</p>';
          return;
        }

        pageCount.innerText = `${pages.length} Pages`;

        let html = '';
        pages.forEach(imgUrl => {
          html += `<img src="${imgUrl}" loading="lazy" alt="Page">`;
        });

        container.innerHTML = html;
      } catch (err) {
        document.getElementById('pagesContainer').innerHTML = '<p style="margin-top:80px; color:#888;">Error loading chapter pages.</p>';
      }
    }

    loadPages();
  </script>
</body>
</html>
