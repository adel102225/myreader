<!DOCTYPE html>
<html lang="en">
<head><meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: #121317; 
      color: #e2e8f0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-bottom: 80px; 
    }

    /* Top Navigation Header */
    header { 
      background: #1a1c23; 
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      border-bottom: 1px solid #2d313e;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-weight: 800; font-size: 18px; color: #a855f7; letter-spacing: 0.5px; }
    .search-box input {
      background: #252836;
      border: 1px solid #363b4e;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      width: 140px;
      outline: none;
    }

    .container { padding: 12px; max-width: 1000px; margin: 0 auto; }

    /* Section Headers */
    .section-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin: 20px 0 12px 0; 
    }
    .section-title { 
      font-size: 15px; 
      font-weight: 700; 
      color: #f1f5f9; 
      border-left: 3px solid #a855f7; 
      padding-left: 8px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 1. Hot / Featured Horizontal Slider */
    .slider-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .slider-container::-webkit-scrollbar { display: none; }
    
    .slide-card {
      flex: 0 0 120px;
      text-decoration: none;
      color: #fff;
    }
    .slide-img-wrapper {
      width: 120px;
      height: 170px;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1c23;
      position: relative;
    }
    .slide-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .slide-title { font-size: 11px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 2. Latest Updates Grid (2 Columns) */
    .latest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .latest-card {
      background: #1a1c23;
      border: 1px solid #2d313e;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .latest-img {
      width: 65px;
      height: 90px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #252836;
    }
    .latest-info { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; overflow: hidden; }
    .latest-title { font-size: 12px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .latest-badge { 
      align-self: flex-start;
      background: #252836; 
      color: #a855f7; 
      border: 1px solid #363b4e;
      font-size: 10px; 
      font-weight: 600; 
      padding: 3px 6px; 
      border-radius: 4px; 
      margin-top: 4px;
    }

    /* 3. Top 10 Ranked List */
    .top-list { display: flex; flex-direction: column; gap: 8px; }
    .top-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1c23;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #2d313e;
      text-decoration: none;
      color: #fff;
    }
    .top-rank { font-size: 16px; font-weight: 800; color: #a855f7; width: 20px; text-align: center; }
    .top-title { font-size: 12px; font-weight: 600; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Fixed Nav */
    .nav-bar { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      background: #1a1c23; 
      border-top: 1px solid #2d313e; 
      display: flex; 
      justify-content: space-around; 
      padding: 10px 0; 
      z-index: 1000;
    }
    .nav-item { text-align: center; color: #888; font-size: 10px; text-decoration: none; font-weight: 600; }
    .nav-item.active { color: #a855f7; }
  html,body{max-width:100%;overflow-x:hidden}.latest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.latest-card,.latest-info{min-width:0}.latest-title{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.search-box{display:flex;gap:6px}.search-box input{width:110px}.search-box button{background:#a855f7;color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:12px}</style>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#121317"><link rel="apple-touch-icon" href="/icon-192.png"></head>
<body>

  <header>
    <div class="brand">My Reader</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search title..." onkeypress="handleSearch(event)">
      <button onclick="doSearch()">Search</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Hot / Featured Slider -->
    <div class="section-header">
      <div class="section-title">Hot Series</div>
    </div>
    <div id="hotSlider" class="slider-container">
      <div style="color: #666; font-size: 12px; padding: 10px;">Loading hot series...</div>
    </div>

    <!-- Latest Updates -->
    <div class="section-header">
      <div class="section-title">Latest Releases</div>
    </div>
    <div id="latestGrid" class="latest-grid">
      <div style="color: #666; font-size: 12px; grid-column: span 2; padding: 10px;">Loading updates...</div>
    </div>

    <!-- Top Ranked List -->
    <div class="section-header">
      <div class="section-title">Top 10 Popular</div>
    </div>
    <div id="topList" class="top-list">
      <div style="color: #666; font-size: 12px; padding: 10px;">Loading top series...</div>
    </div>

  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-item active">HOME</a>
    <a href="#" class="nav-item">DISCOVER</a>
    <a href="#" class="nav-item">BOOKMARKS</a>
    <a href="#" class="nav-item">PROFILE</a>
  </nav>

  <script>
    async function fetchHomeData() {
      try {
        const res = await fetch('/api/catalog');
        const items = await res.json();

        if (!items || items.length === 0) return;

        // Populate Hot Slider (First 6 Items)
        const hotItems = items.slice(0, 6);
        let hotHtml = '';
        hotItems.forEach(item => {
          hotHtml += `
            <a href="read.html?id=${item.id}" class="slide-card">
              <div class="slide-img-wrapper">
                <img src="${item.coverUrl || 'https://via.placeholder.com/120x170'}" alt="${item.title}">
              </div>
              <div class="slide-title">${item.title}</div>
            </a>
          `;
        });
        document.getElementById('hotSlider').innerHTML = hotHtml;

        // Populate Latest Grid (Next 8 Items)
        const latestItems = items.slice(6, 14);
        let latestHtml = '';
        latestItems.forEach(item => {
          latestHtml += `
            <a href="read.html?id=${item.id}" class="latest-card">
              <img src="${item.coverUrl || 'https://via.placeholder.com/65x90'}" class="latest-img" alt="${item.title}">
              <div class="latest-info">
                <div class="latest-title">${item.title}</div>
                <div class="latest-badge">NEW</div>
              </div>
            </a>
          `;
        });
        document.getElementById('latestGrid').innerHTML = latestHtml;

        // Populate Top Ranked List (Remaining Items)
        const topItems = items.slice(0, 10);
        let topHtml = '';
        topItems.forEach((item, index) => {
          topHtml += `
            <a href="read.html?id=${item.id}" class="top-item">
              <div class="top-rank">${index + 1}</div>
              <div class="top-title">${item.title}</div>
              <span style="color: #666; font-size: 12px;">→</span>
            </a>
          `;
        });
        document.getElementById('topList').innerHTML = topHtml;

      } catch (err) {
        console.error("Failed to load homepage data", err);
      }
    }

    async function handleSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (!query) return;

        const grid = document.getElementById('latestGrid');
        grid.innerHTML = '<div style="color: #666; grid-column: span 2; padding: 10px;">Searching...</div>';

        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
          const results = await res.json();

          if (!results || results.length === 0) {
            grid.innerHTML = '<div style="color: #666; grid-column: span 2; padding: 10px;">No results found.</div>';
            return;
          }

          let searchHtml = '';
          results.forEach(item => {
            searchHtml += `
              <a href="read.html?id=${item.id}" class="latest-card">
                <img src="${item.coverUrl || 'https://via.placeholder.com/65x90'}" class="latest-img" alt="${item.title}">
                <div class="latest-info">
                  <div class="latest-title">${item.title}</div>
                  <div class="latest-badge">RESULT</div>
                </div>
              </a>
            `;
          });
          grid.innerHTML = searchHtml;
        } catch (err) {
          grid.innerHTML = '<div style="color: #666; grid-column: span 2; padding: 10px;">Search failed.</div>';
        }
      }
    }

    function doSearch(){handleSearch({key:"Enter",target:document.getElementById("searchInput")})}
    fetchHomeData();
  </script>
<script src="genres.js"></script><script src="search.js"></script><script src="shortcuts.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script><script src="library.js"></script></body>
</html>
